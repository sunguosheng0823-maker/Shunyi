name: 功能建议 / Feature request
description: 说明实际使用场景和希望改善的行为。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景和遇到的问题 / Use case
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望实现的行为 / Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方式及其他信息 / Alternatives
