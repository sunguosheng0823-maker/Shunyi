name: Windows 构建（瞬移客户端）

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client/src-tauri

      - name: 安装前端依赖
        working-directory: client/ui
        run: npm ci

      - name: 打包（NSIS 安装器 + MSI）
        working-directory: client/ui
        run: npx tauri build

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: shunyi-windows-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
