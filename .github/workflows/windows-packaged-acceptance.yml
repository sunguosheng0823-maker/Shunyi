name: Windows packaged desktop acceptance
on:
  push:
    branches: [codex/desktop-acceptance]
  workflow_dispatch:
    inputs:
      build_run:
        description: Native build run containing the Windows package
        required: true
        default: '34992710015'
      artifact_name:
        description: Windows native build artifact name
        required: true
        default: shunyi-desktop-preview-Windows-95c1feb2de5e6dea6a7b01e7850f3fd97ab22f1f
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            engines/rustdesk -> ../../target/desktop-engine
      - name: Native test dependencies
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run || '34992710015' }}
          name: ${{ inputs.artifact_name || 'shunyi-desktop-preview-Windows-95c1feb2de5e6dea6a7b01e7850f3fd97ab22f1f' }}
          path: prebuilt
      - name: Check the downloaded native binaries
        run: python scripts/verify_desktop_artifacts.py prebuilt/desktop-distribution --receipt target/desktop-verification/artifact-integrity.json
      - name: Build disposable acceptance tools
        run: cargo build --locked -p rc-server --example native_fixture --example desktop_acceptance
      - name: Real desktop capture and input
        timeout-minutes: 3
        run: python scripts/verify_desktop_ci.py prebuilt/desktop-distribution/x86_64-pc-windows-msvc/portable/shunyi-desktop-engine.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packaged-acceptance-${{ github.sha }}
          path: target/desktop-verification/
          if-no-files-found: warn
